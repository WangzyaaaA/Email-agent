name: CI

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python 3.12 tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project with test and gateway extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test,gateway]"

      - name: Run test suite
        run: python -m pytest

      - name: Byte-compile every module
        run: python -m compileall -q app push_gateway tests

      - name: Check installed requirements
        run: python -m pip check
