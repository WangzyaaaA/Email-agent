org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.compiler.execution.strategy=in-process

# Supply these through ~/.gradle/gradle.properties or CI secrets. They are public
# Firebase Android identifiers, but keeping projects separate prevents accidental
# debug/production crossover.
MAIL_SENTINEL_FIREBASE_API_KEY=
MAIL_SENTINEL_FIREBASE_APPLICATION_ID=
MAIL_SENTINEL_FIREBASE_PROJECT_ID=
MAIL_SENTINEL_FIREBASE_SENDER_ID=
