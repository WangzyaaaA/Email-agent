[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mail-sentinel"
version = "0.1.0"
description = "Read-only email agent for OTP forwarding, important alerts, follow-ups and digests."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "APScheduler>=3.10,<4",
  "argon2-cffi>=23.1,<26",
  "beautifulsoup4>=4.12,<5",
  "certifi>=2026.10.19",
  "cryptography>=50.0.2,<51",
  "dateparser>=1.2,<2",
  "dnspython>=2.7,<3",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "imapclient>=3.0,<4",
  "itsdangerous>=2.2,<3",
  "jinja2>=3.1,<4",
  "pillow>=13.0.0,<14",
  "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.12,<1",
  "qrcode[pil]>=8,<9",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=9.0.3,<10",
]
gateway = [
  "google-auth>=2.40,<3",
]

[tool.setuptools.packages.find]
include = ["app*", "push_gateway*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
