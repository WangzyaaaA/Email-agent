# Include this file inside the existing nginx.conf http {} block.
# Replaces /home/bwg/nginx_conf/sites-enabled/mail, not the main nginx.conf.
log_format mail_sentinel_safe
    '$time_iso8601 status=$status bytes=$body_bytes_sent duration=$request_time';

server {
    listen 443 ssl;
    server_name mail.zonwe.top;

    ssl_certificate /etc/nginx/ssl/fullchain.cer;
    ssl_certificate_key /etc/nginx/ssl/zonwe.top.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 16k;
    client_body_buffer_size 16k;
    client_body_in_file_only off;
    client_body_timeout 15s;

    access_log /var/log/nginx/mail-sentinel-access.log mail_sentinel_safe;
    error_log /dev/null;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    location / {
        set $mail_sentinel_backend mail-sentinel-push-gateway:8090;
        # Preserve the original path/query: both are covered by device HMAC.
        proxy_pass http://$mail_sentinel_backend$request_uri;
        proxy_http_version 1.1;
        proxy_redirect off;

        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header Upgrade "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Forwarded "";

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        proxy_cache off;
        proxy_store off;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_hide_header Server;
    }
}

server {
    listen 80;
    server_name mail.zonwe.top;

    access_log off;
    error_log /dev/null;
    return 301 https://mail.zonwe.top$request_uri;
}
