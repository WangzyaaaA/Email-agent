services:
  gateway:
    build:
      context: ../..
      dockerfile: push_gateway/Dockerfile
    restart: unless-stopped
    environment:
      PUSH_GATEWAY_MASTER_KEY: "${PUSH_GATEWAY_MASTER_KEY:?Set PUSH_GATEWAY_MASTER_KEY}"
      PUSH_GATEWAY_DATABASE_URL: "sqlite:////data/push_gateway.db"
      PUSH_GATEWAY_HOST: "0.0.0.0"
      PUSH_GATEWAY_PORT: "8090"
      PUSH_GATEWAY_FIREBASE_PROJECT_ID: "${PUSH_GATEWAY_FIREBASE_PROJECT_ID:?Set Firebase project id}"
      PUSH_GATEWAY_FIREBASE_SERVICE_ACCOUNT_FILE: "/run/secrets/firebase-service-account.json"
      PUSH_GATEWAY_TRUSTED_PROXY_HEADERS: "true"
    volumes:
      - gateway-data:/data
      - ./secrets/firebase-service-account.json:/run/secrets/firebase-service-account.json:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  nginx:
    image: nginx:1.30-alpine
    restart: unless-stopped
    ports:
      - "443:8443"
    environment:
      PUSH_GATEWAY_DOMAIN: "${PUSH_GATEWAY_DOMAIN:?Set the gateway domain}"
      NGINX_ENVSUBST_FILTER: "^PUSH_GATEWAY_DOMAIN$$"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-gateway.conf.template:/etc/nginx/templates/default.conf.template:ro
      - type: bind
        source: "${PUSH_GATEWAY_TLS_DIR:-./secrets/tls}"
        target: /etc/nginx/ssl
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:size=1m,noexec,nosuid,nodev
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
    depends_on:
      - gateway

networks:
  internal:
    internal: false

volumes:
  gateway-data:
